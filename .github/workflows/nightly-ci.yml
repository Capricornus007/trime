name: Nightly
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 / GMT+8 0:00, daily

env:
  CI_NAME: Nightly CI
jobs:
  build:
    # 上游鎖死只給 osfans/trime；這支 fork 要每天有能裝的包（九鍵的實測包就靠它），
    # 所以把自己的倉加進白名單，條件其餘照上游。
    if: ${{ (github.repository == 'osfans/trime' || github.repository == 'Capricornus007/trime') && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Trime
        run: make release

      # 同 release-ci：驗產物不驗配置（規則 71）。nightly 也會發佈到 releases，
      # 未簽名的包一旦上線，手機上那支就再也升級不了（指紋不同）。
      - name: Verify APK signing
        uses: ./.github/actions/verify-apk-signing
        with:
          keystore-password: ${{ secrets.KEY_STORE_PASSWORD }}

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Delete Previous Nightly Release
        continue-on-error: true
        run: |
          gh release delete --yes --cleanup-tag nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Nightly Build"
          tag_name: nightly
          prerelease: true
          working_directory: "app/build/outputs/apk/release/"
          files: |
            *.apk
